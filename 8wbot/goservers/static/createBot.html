<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建机器人 - 8WBot</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,760&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page-shell">
  <nav class="top-nav">
    <div class="nav-inner"><a class="brand" href="/"><span class="brand-mark">8W</span><span>8WBot</span></a><div class="nav-pills"><a href="/">首页</a><a href="/user.html">用户中心</a><a class="active" href="/createBot.html">创建机器人</a></div></div>
  </nav>
  <main id="app" class="container">
    <section class="form-card panel">
      <div class="section-title" style="display:block;text-align:center"><h2>创建机器人</h2><p>输入游戏内使用的机器人用户名。创建后需要回到用户中心完成归属验证。</p></div>
      <div v-if="msg.text" :class="['msg', msg.type]">{{ msg.text }}</div>
      <div class="notice" style="margin-bottom:16px"><svg class="svg" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg><div><strong>小心误触</strong>请确认用户名拼写正确。创建成功后会占用一次创建额度。</div></div>
      <div class="field"><label for="bot_name">机器人用户名</label><input id="bot_name" v-model.trim="botName" type="text" placeholder="输入游戏内用户名" @input="msg.text=''" @keyup.enter="handleCreate"></div>
      <button class="btn primary" style="width:100%" :disabled="loading || !botName" @click="handleCreate">{{ loading ? '正在创建' : '创建机器人' }}</button>
      <a class="btn" href="/user.html" style="width:100%;margin-top:12px">返回用户中心</a>
    </section>
  </main>
</div>
<script>
const { createApp, ref, reactive } = Vue;
createApp({setup(){const botName=ref(''),loading=ref(false),msg=reactive({text:'',type:''});function okCode(v){return String(v)==='200'||Number(v)===200}function getCookie(name){const m=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));return m?decodeURIComponent(m[2]):''}async function handleCreate(){if(!botName.value||loading.value)return;loading.value=true;msg.text='';const token=getCookie('8wbot_token')||localStorage.getItem('8wbot_token');if(!token){msg.text='未登录，请先登录';msg.type='error';loading.value=false;return}try{const res=await fetch('/api/createbot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({access_token:token,bot_name:botName.value})});const data=await res.json();if(okCode(data.code)){msg.text=data.message||'创建成功，请完成归属验证';msg.type='success';setTimeout(()=>location.href='/user.html',1200)}else if(Number(data.code)===409){msg.text=data.message||'用户名已被占用';msg.type='warn'}else{msg.text=data.message||data.msg||'创建失败';msg.type='error'}}catch(e){msg.text='网络错误: '+e.message;msg.type='error'}finally{loading.value=false}}return{botName,loading,msg,handleCreate}}}).mount('#app');
</script>
</body>
</html>
